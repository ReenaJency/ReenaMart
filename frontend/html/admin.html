<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - ReenaMart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        /* HEADER */

        header {
            background: #1f4d3a;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .logout {
            background: #f5a623;

            color: white;

            padding: 10px 18px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: bold;
        }

        /* MAIN */

        .container {
            width: 92%;
            max-width: 1200px;

            margin: 30px auto;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            color: #1f4d3a;

            margin-bottom: 7px;
        }

        .title p {
            color: #777;
        }

        /* DASHBOARD CARDS */

        .dashboard {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 35px;
        }

        .dashboard-card {
            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);

            text-align: center;
        }

        .dashboard-card h3 {
            color: #777;

            font-size: 16px;

            margin-bottom: 10px;
        }

        .dashboard-card .number {
            color: #1f4d3a;

            font-size: 30px;

            font-weight: bold;
        }

        /* SECTION */

        .section {
            background: white;

            padding: 25px;

            border-radius: 10px;

            margin-bottom: 25px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }

        .section h2 {
            color: #1f4d3a;

            margin-bottom: 20px;
        }

        /* TABLE */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;

            border-bottom: 1px solid #ddd;

            text-align: left;
        }

        th {
            background: #1f4d3a;

            color: white;
        }

        /* PRODUCT IMAGE */

        .product-img {
            width: 55px;
            height: 55px;

            object-fit: cover;

            border-radius: 6px;
        }

        /* BUTTON */

        .delete-btn {
            background: #d9534f;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }

        .delete-btn:hover {
            opacity: 0.85;
        }

        /* STATUS */

        .status {
            font-weight: bold;
        }

        /* EMPTY */

        .empty {
            text-align: center;

            padding: 30px;

            color: #777;
        }

        /* MOBILE */

        @media(max-width: 750px) {

            header {
                padding: 15px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>
        ReenaMart - Admin
    </h1>

    <a
        href="index.html"
        class="logout">

        Home

    </a>

</header>



<!-- MAIN -->

<div class="container">


    <div class="title">

        <h2>
            Admin Dashboard
        </h2>

        <p>
            Manage products, users and customer orders.
        </p>

    </div>



    <!-- DASHBOARD -->

    <div class="dashboard">


        <div class="dashboard-card">

            <h3>
                Total Products
            </h3>

            <div
                class="number"
                id="productCount">

                0

            </div>

        </div>



        <div class="dashboard-card">

            <h3>
                Total Orders
            </h3>

            <div
                class="number"
                id="orderCount">

                0

            </div>

        </div>



        <div class="dashboard-card">

            <h3>
                Total Users
            </h3>

            <div
                class="number"
                id="userCount">

                0

            </div>

        </div>


    </div>



    <!-- PRODUCTS -->

    <div class="section">

        <h2>
            Product Management
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Image
                        </th>

                        <th>
                            Product
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="productTable">

                </tbody>

            </table>

        </div>

    </div>



    <!-- ORDERS -->

    <div class="section">

        <h2>
            Order Management
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Product
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="orderTable">

                </tbody>

            </table>

        </div>

    </div>



    <!-- USERS -->

    <div class="section">

        <h2>
            User Management
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Username
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Role
                        </th>

                    </tr>

                </thead>


                <tbody id="userTable">

                </tbody>

            </table>

        </div>

    </div>


</div>



<script>


/* =====================================
   LOAD DATA
===================================== */

let products =
    JSON.parse(
        localStorage.getItem("sellerProducts")
    ) || [];


let orders =
    JSON.parse(
        localStorage.getItem("orders")
    ) || [];


let users =
    JSON.parse(
        localStorage.getItem("users")
    ) || [];



/* =====================================
   DASHBOARD COUNTS
===================================== */

document.getElementById(
    "productCount"
).textContent = products.length;


document.getElementById(
    "orderCount"
).textContent = orders.length;


document.getElementById(
    "userCount"
).textContent = users.length;



/* =====================================
   DISPLAY PRODUCTS
===================================== */

function displayProducts() {

    const table =
        document.getElementById(
            "productTable"
        );


    table.innerHTML = "";


    if (products.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    No products available.

                </td>

            </tr>

        `;

        return;
    }


    products.forEach(
        (product, index) => {

            table.innerHTML += `

                <tr>

                    <td>

                        <img
                            src="${product.image || ''}"
                            class="product-img"
                            onerror="this.style.display='none'"
                        >

                    </td>


                    <td>
                        ${product.name}
                    </td>


                    <td>
                        ${product.category || "-"}
                    </td>


                    <td>
                        ₹${product.price}
                    </td>


                    <td>

                        <button
                            class="delete-btn"
                            onclick="deleteProduct(${index})">

                            Remove

                        </button>

                    </td>

                </tr>

            `;

        }
    );

}



/* =====================================
   DELETE PRODUCT
===================================== */

function deleteProduct(index) {

    const productName =
        products[index].name;


    const confirmDelete =
        confirm(
            "Remove " +
            productName +
            " from ReenaMart?"
        );


    if (!confirmDelete) {
        return;
    }


    products.splice(index, 1);


    localStorage.setItem(
        "sellerProducts",
        JSON.stringify(products)
    );


    document.getElementById(
        "productCount"
    ).textContent = products.length;


    displayProducts();


    alert(
        "Product removed successfully!"
    );

}



/* =====================================
   DISPLAY ORDERS
===================================== */

function displayOrders() {

    const table =
        document.getElementById(
            "orderTable"
        );


    table.innerHTML = "";


    if (orders.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    No orders available.

                </td>

            </tr>

        `;

        return;
    }


    orders.forEach(
        (order, index) => {

            const product =
                order.product || order;


            const quantity =
                Number(
                    order.quantity || 1
                );


            const price =
                Number(
                    product.price || 0
                );


            const total =
                Number(
                    order.total ||
                    price * quantity
                );


            table.innerHTML += `

                <tr>

                    <td>

                        ${order.orderId ||
                        "RM" + (1000 + index)}

                    </td>


                    <td>

                        ${product.name ||
                        "Product"}

                    </td>


                    <td>

                        ${quantity}

                    </td>


                    <td>

                        ₹${total}

                    </td>


                    <td class="status">

                        ${order.status ||
                        "Pending"}

                    </td>

                </tr>

            `;

        }
    );

}



/* =====================================
   DISPLAY USERS
===================================== */

function displayUsers() {

    const table =
        document.getElementById(
            "userTable"
        );


    table.innerHTML = "";


    if (users.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty">

                    No registered users available.

                </td>

            </tr>

        `;

        return;
    }


    users.forEach(
        (user, index) => {

            table.innerHTML += `

                <tr>

                    <td>
                        ${user.id || index + 1}
                    </td>

                    <td>
                        ${user.username || "-"}
                    </td>

                    <td>
                        ${user.email || "-"}
                    </td>

                    <td>
                        ${user.role || "Buyer"}
                    </td>

                </tr>

            `;

        }
    );

}



/* =====================================
   INITIAL LOAD
===================================== */

displayProducts();

displayOrders();

displayUsers();


</script>


</body>

</html>

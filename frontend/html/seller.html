<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Store - ReenaMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f6;
            color: #333;
        }

        header {
            background: #1f4d3a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        nav a:hover {
            color: #f5a623;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .store-header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .store-header h2 {
            color: #1f4d3a;
            margin-bottom: 10px;
        }

        .store-header p {
            color: #666;
            margin: 6px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .approved {
            background: #d4edda;
            color: #155724;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card span {
            font-size: 27px;
            font-weight: bold;
            color: #1f4d3a;
        }

        .products-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .products-section h2 {
            color: #1f4d3a;
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        .product-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #eee;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            color: #1f4d3a;
            margin-bottom: 8px;
        }

        .product-info p {
            margin: 7px 0;
            color: #555;
            font-size: 14px;
        }

        .price {
            color: #1f4d3a !important;
            font-size: 18px !important;
            font-weight: bold;
        }

        .actions {
            margin-top: 15px;
        }

        .manage-btn {
            display: inline-block;
            background: #1f4d3a;
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .manage-btn:hover {
            background: #163a2c;
        }

        .empty {
            text-align: center;
            padding: 45px 20px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            color: #777;
        }

        .empty h3 {
            color: #555;
            margin-bottom: 8px;
        }

        .notice {
            margin-top: 15px;
            padding: 14px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .success-notice {
            background: #d4edda;
            color: #155724;
        }

        .warning-notice {
            background: #fff3cd;
            color: #856404;
        }

        footer {
            background: #1f4d3a;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 850px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>ReenaMart Seller Store</h1>

    <nav>
        <a href="seller-dashboard.html">Dashboard</a>
        <a href="seller.html">My Store</a>
        <a href="seller-products.html">My Products</a>
        <a href="seller-orders.html">Orders</a>
        <a href="index.html">Logout</a>
    </nav>

</header>

<div class="container">

    <div class="store-header">

        <h2 id="shopName">
            My Store
        </h2>

        <p>
            <strong>Seller:</strong>
            <span id="sellerName">-</span>
        </p>

        <p>
            <strong>Email:</strong>
            <span id="sellerEmail">-</span>
        </p>

        <p>
            <strong>Mobile:</strong>
            <span id="sellerMobile">-</span>
        </p>

        <p>
            <strong>Seller Status:</strong>
            <span id="sellerStatus" class="status pending">
                PENDING
            </span>
        </p>

        <div id="approvalMessage"></div>

    </div>

    <div class="stats">

        <div class="stat-card">

            <h3>Total Products</h3>

            <span id="totalProducts">
                0
            </span>

        </div>

        <div class="stat-card">

            <h3>Approved Products</h3>

            <span id="approvedProducts">
                0
            </span>

        </div>

        <div class="stat-card">

            <h3>Pending Products</h3>

            <span id="pendingProducts">
                0
            </span>

        </div>

        <div class="stat-card">

            <h3>Total Orders</h3>

            <span id="totalOrders">
                0
            </span>

        </div>

    </div>

    <div class="products-section">

        <h2>My Products</h2>

        <div
            id="productsContainer"
            class="products-grid"
        ></div>

    </div>

</div>

<footer>

    © 2026 ReenaMart | Seller Store

</footer>

<script>

    const sellerData =
        JSON.parse(
            localStorage.getItem("sellerRegistration")
        );

    if (!sellerData) {

        alert("Seller information not found.");

        window.location.href =
            "seller-login.html";
    }

    const sellerEmail =
        sellerData?.email || "";

    function getSellerStatus() {

        return (
            sellerData?.approvalStatus ||
            localStorage.getItem("sellerApprovalStatus") ||
            "PENDING"
        ).toUpperCase();

    }

    function loadSellerInfo() {

        const sellerName =
            sellerData?.sellerName ||
            sellerData?.name ||
            "Seller";

        const shopName =
            sellerData?.shopName ||
            "My Store";

        const mobile =
            sellerData?.mobile ||
            sellerData?.phone ||
            "-";

        const status =
            getSellerStatus();

        document.getElementById("shopName").textContent =
            shopName;

        document.getElementById("sellerName").textContent =
            sellerName;

        document.getElementById("sellerEmail").textContent =
            sellerEmail || "-";

        document.getElementById("sellerMobile").textContent =
            mobile;

        const statusElement =
            document.getElementById("sellerStatus");

        statusElement.textContent =
            status;

        statusElement.className =
            "status " + status.toLowerCase();

        const message =
            document.getElementById("approvalMessage");

        if (status === "APPROVED") {

            message.innerHTML = `
                <div class="notice success-notice">
                    Your seller account is approved.
                    You can add multiple products.
                    Each product must be approved by the admin.
                </div>
            `;

        } else if (status === "PENDING") {

            message.innerHTML = `
                <div class="notice warning-notice">
                    Your seller account is waiting for admin approval.
                </div>
            `;

        } else {

            message.innerHTML = `
                <div class="notice"
                     style="background:#f8d7da;color:#721c24;">
                    Your seller account has been rejected.
                </div>
            `;
        }
    }

    function getMyProducts() {

        const products =
            JSON.parse(
                localStorage.getItem("sellerProducts")
            ) || [];

        return products.filter(product =>

            product.sellerEmail === sellerEmail ||
            product.sellerId === sellerEmail

        );
    }

    function displayProducts() {

        const container =
            document.getElementById("productsContainer");

        const myProducts =
            getMyProducts();

        document.getElementById("totalProducts").textContent =
            myProducts.length;

        const approvedProducts =
            myProducts.filter(product =>

                (
                    product.approvalStatus ||
                    "PENDING"
                ).toUpperCase() === "APPROVED"

            );

        const pendingProducts =
            myProducts.filter(product =>

                (
                    product.approvalStatus ||
                    "PENDING"
                ).toUpperCase() === "PENDING"

            );

        document.getElementById("approvedProducts").textContent =
            approvedProducts.length;

        document.getElementById("pendingProducts").textContent =
            pendingProducts.length;

        if (myProducts.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <h3>No Products Added Yet</h3>

                    <p>
                        You have not added any products.
                    </p>

                    <br>

                    <a
                        href="seller-products.html"
                        class="manage-btn"
                    >
                        Add Product
                    </a>

                </div>
            `;

            return;
        }

        container.innerHTML =
            myProducts.map(product => {

                const status =
                    (
                        product.approvalStatus ||
                        "PENDING"
                    ).toUpperCase();

                let statusClass =
                    "pending";

                if (status === "APPROVED") {
                    statusClass = "approved";
                }

                if (status === "REJECTED") {
                    statusClass = "rejected";
                }

                const price =
                    Number(
                        product.finalPrice ??
                        product.sellingPrice ??
                        product.price ??
                        0
                    );

                return `
                    <div class="product-card">

                        <img
                            src="${product.image || ""}"
                            alt="${product.name || "Product"}"
                            onerror="this.src='https://via.placeholder.com/400x250?text=No+Image'"
                        >

                        <div class="product-info">

                            <h3>
                                ${product.name || "Unnamed Product"}
                            </h3>

                            <p>
                                <strong>Category:</strong>
                                ${product.category || "-"}
                            </p>

                            ${
                                product.category === "Fashion"
                                ?
                                `
                                <p>
                                    <strong>Size:</strong>
                                    ${product.size || "-"}
                                </p>
                                `
                                : ""
                            }

                            <p class="price">
                                ₹${price.toFixed(2)}
                            </p>

                            <p>
                                <strong>Product Status:</strong>
                                <span class="status ${statusClass}">
                                    ${status}
                                </span>
                            </p>

                            <div class="actions">

                                <a
                                    href="seller-products.html"
                                    class="manage-btn"
                                >
                                    Manage Product
                                </a>

                            </div>

                        </div>

                    </div>
                `;

            }).join("");
    }

    function loadOrderCount() {

        const orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];

        let count = 0;

        orders.forEach(order => {

            let orderProducts = [];

            if (Array.isArray(order.products)) {

                orderProducts =
                    order.products;

            } else if (order.product) {

                orderProducts =
                    [order.product];
            }

            const hasMyProduct =
                orderProducts.some(product =>

                    product.sellerEmail === sellerEmail ||
                    product.sellerId === sellerEmail

                );

            if (hasMyProduct) {
                count++;
            }

        });

        document.getElementById("totalOrders").textContent =
            count;
    }

    loadSellerInfo();
    displayProducts();
    loadOrderCount();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="topbar">
        <a href="index.html" class="logo">ReenaMart</a>
        <nav id="nav" class="nav"></nav>
    </header>

    <main class="container">
        <h1>Our Products</h1>
        <p class="muted">Discover products available at ReenaMart.</p>

        <br>

        <div class="search-row">
            <input
                type="search"
                id="search"
                placeholder="Search products..."
                aria-label="Search products"
            >

            <select id="category" aria-label="Filter by category">
                <option value="">All Categories</option>
                <option value="Fashion">Fashion</option>
                <option value="Jewellery">Jewellery</option>
                <option value="Electronics">Electronics</option>
                <option value="Beauty">Beauty</option>
            </select>
        </div>

        <br>

        <div id="productGrid" class="grid" aria-live="polite">
            <div class="box center">Loading products...</div>
        </div>
    </main>

    <script src="../js/script.js"></script>
    <script src="../js/ai-bot.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof initProducts === "function") {
                initProducts();
            }
        });
    </script>

</body>
</html>

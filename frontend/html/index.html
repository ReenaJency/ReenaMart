<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReenaMart - Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #1f4d3a;
            color: white;
        }

        /* HEADER */
        header {
            height: 70px;
            background: #1f4d3a;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        nav a:hover {
            color: #f5a623;
        }

        /* WELCOME SCREEN */
        .welcome-section {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 70px 20px 20px;

            background:
                linear-gradient(
                    rgba(31, 77, 58, 0.90),
                    rgba(31, 77, 58, 0.90)
                ),
                url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
        }

        .welcome-content {
            width: 90%;
            max-width: 750px;
        }

        .welcome-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .welcome-content h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .welcome-content h2 {
            color: #f5a623;
            font-size: 27px;
            margin-bottom: 20px;
        }

        .welcome-content p {
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        /* START BUTTON */
        .start-btn {
            display: inline-block;

            background: #f5a623;
            color: #222;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            padding: 14px 45px;

            border-radius: 8px;

            transition: 0.2s;
        }

        .start-btn:hover {
            background: #ffc35c;
            transform: translateY(-2px);
        }

        /* MOBILE */
        @media (max-width: 768px) {

            header {
                height: 65px;
                padding: 0 20px;
            }

            .logo {
                font-size: 22px;
            }

            .welcome-section {
                padding-top: 65px;
            }

            .welcome-icon {
                font-size: 50px;
            }

            .welcome-content h1 {
                font-size: 38px;
            }

            .welcome-content h2 {
                font-size: 21px;
            }

            .welcome-content p {
                font-size: 15px;
            }

            .start-btn {
                font-size: 16px;
                padding: 13px 38px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            🛍️ ReenaMart
        </div>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <!-- WELCOME SCREEN -->
    <section class="welcome-section">

        <div class="welcome-content">

            <div class="welcome-icon">
                🛍️
            </div>

            <h1>
                Welcome to ReenaMart
            </h1>

            <h2>
                Your Smart Online Shopping Destination
            </h2>

            <p>
                Discover fashion, jewellery, electronics,
                beauty products and more — all in one place.
            </p>

            <!-- DIRECT PAGE NAVIGATION -->
            <a href="role.html" class="start-btn">
                START
            </a>

        </div>

    </section>

</body>

</html>

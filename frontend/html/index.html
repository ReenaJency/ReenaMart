<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reena Mart - Welcome</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #222;

            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 30px 20px 15px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #666;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-box {
            width: 100%;
            max-width: 500px;
            background-color: white;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        .welcome-box h2 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        .welcome-box > p {
            margin: 0 0 25px;
            color: #666;
        }

        .auth-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            min-width: 120px;
            padding: 12px 30px;

            text-decoration: none;
            text-align: center;

            font-size: 16px;
            font-weight: bold;

            border-radius: 6px;

            background-color: #2874f0;
            color: white;
        }

        .btn:hover {
            background-color: #1557c0;
        }

        .info-text {
            margin-top: 22px;
            line-height: 1.7;
            font-size: 14px;
            color: #666;
        }

        footer {
            text-align: center;
            padding: 15px 10px;
            background-color: white;
            border-top: 1px solid #ddd;
            font-size: 14px;
            color: #666;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 500px) {

            .auth-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 180px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🛍️ Reena Mart</h1>
        <p>Your Online Shopping Destination</p>
    </header>

    <main>

        <div class="welcome-box">

            <h2>Welcome to Reena Mart</h2>

            <p>
                Shop your favourite products easily and securely.
            </p>

            <div class="auth-buttons">

                <a href="register.html" class="btn">
                    Register
                </a>

                <a href="login.html" class="btn">
                    Login
                </a>

            </div>

            <div class="info-text">
                <div>New to Reena Mart? Please register to continue.</div>
                <div>Already registered? Please login to continue.</div>
            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 Reena Mart | Online Shopping Website</p>
    </footer>

</body>

</html>

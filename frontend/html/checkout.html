<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="topbar">
        <a href="index.html" class="logo">ReenaMart</a>
        <nav id="nav" class="nav"></nav>
    </header>

    <main class="container">

        <section class="page-heading">
            <h1>Checkout</h1>
            <p>Enter your delivery details to place your order.</p>
        </section>

        <div class="grid-2">

            <section class="form-box">

                <h2>Delivery Information</h2>

                <form id="checkoutForm">

                    <label for="customerName">Customer Name</label>
                    <input
                        type="text"
                        id="customerName"
                        name="customerName"
                        placeholder="Enter your full name"
                        required
                    >

                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="mobile">Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="10-digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                    <label for="address">Delivery Address</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        placeholder="Door number, street and area"
                        required
                    ></textarea>

                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                        required
                    >

                    <label for="state">State</label>
                    <input
                        type="text"
                        id="state"
                        name="state"
                        value="Tamil Nadu"
                        required
                    >

                    <label for="pincode">Pincode</label>
                    <input
                        type="text"
                        id="pincode"
                        name="pincode"
                        inputmode="numeric"
                        placeholder="6-digit pincode"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        required
                    >

                    <label for="paymentMethod">Payment Method</label>

                    <select id="paymentMethod" name="paymentMethod" required>
                        <option value="COD">Cash on Delivery</option>
                        <option value="UPI">UPI</option>
                        <option value="CARD">Card</option>
                    </select>

                    <p class="muted">
                        UPI and Card payments require payment gateway
                        integration to process real payments.
                    </p>

                    <button type="submit" class="btn full">
                        Place Order
                    </button>

                </form>

            </section>

            <aside>

                <div class="box">

                    <h2>Order Summary</h2>

                    <div id="checkoutItems">
                        <p>Loading selected products...</p>
                    </div>

                    <hr>

                    <p>
                        Subtotal:
                        <strong id="checkoutSubtotal">₹0</strong>
                    </p>

                    <p>
                        Delivery:
                        <strong>Free</strong>
                    </p>

                    <h2>
                        Total:
                        <span id="checkoutTotal">₹0</span>
                    </h2>

                    <a
                        href="cart.html"
                        class="btn gray full"
                        id="editCartLink"
                    >
                        Edit Cart
                    </a>

                    <a href="products.html" class="btn gray full">
                        Continue Shopping
                    </a>

                </div>

            </aside>

        </div>

    </main>

    <script src="../js/script.js"></script>
    <script src="../js/ai-bot.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            if (typeof initCheckout === "function") {
                initCheckout();
            }

            const params = new URLSearchParams(window.location.search);

            if (params.get("mode") === "buyNow") {
                const editCart = document.getElementById("editCartLink");

                if (editCart) {
                    editCart.style.display = "none";
                }
            }

        });
    </script>

</body>
</html>

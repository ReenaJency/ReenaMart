<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="topbar">
        <a href="index.html" class="logo">ReenaMart</a>
        <nav id="nav" class="nav"></nav>
    </header>

    <main class="container">

        <section class="form-box center">

            <div style="font-size:60px;">✓</div>

            <h1>Order Placed Successfully!</h1>

            <p>Thank you for shopping with ReenaMart.</p>

            <p id="successMessage" aria-live="polite">
                Your order has been submitted.
            </p>

            <div id="orderSummary" class="box">
                Loading order details...
            </div>

            <br>

            <a id="trackOrderBtn" href="tracking.html" class="btn" style="background: var(--green, #1f4d3a); color: #fff;">
                🚚 Track My Order
            </a>

            <a href="order-history.html" class="btn orange">
                View My Orders
            </a>

            <a href="products.html" class="btn gray">
                Continue Shopping
            </a>

        </section>

    </main>

    <script src="../js/script.js"></script>
    <script src="../js/ai-bot.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            if (typeof renderBuyerNav === "function") {
                renderBuyerNav();
            }

            let order = null;

            try {
                order = JSON.parse(
                    localStorage.getItem("lastOrder") || "null"
                );
            } catch (error) {
                console.error("Unable to read order details:", error);
            }

            const box = document.getElementById("orderSummary");

            const money = function (value) {
                return "₹" + Number(value || 0)
                    .toFixed(2)
                    .replace(".00", "");
            };

            if (!order) {
                box.innerHTML = `
                    <p>
                        Order details are unavailable.
                        Please check My Orders for the latest information.
                    </p>
                `;
                return;
            }

            const orderNumber = order.orderId || order.id || "Not available";
            const status = order.status || "PLACED";
            const payment = order.paymentMethod || "COD";

            const trackBtn = document.getElementById("trackOrderBtn");
            if (trackBtn && orderNumber && orderNumber !== "Not available") {
                trackBtn.href = `tracking.html?id=${encodeURIComponent(orderNumber)}`;
            }

            const safeText = function (value) {
                const element = document.createElement("span");
                element.textContent = String(value);
                return element.innerHTML;
            };

            box.innerHTML = `
                <h3>Order Information</h3>

                <p>
                    Order Number:
                    <strong>${safeText(orderNumber)}</strong>
                </p>

                <p>
                    Status:
                    <strong>${safeText(status)}</strong>
                </p>

                <p>
                    Total Amount:
                    <strong>${money(order.total)}</strong>
                </p>

                <p>
                    Payment Method:
                    <strong>${safeText(payment)}</strong>
                </p>
            `;

        });
    </script>

</body>
</html>

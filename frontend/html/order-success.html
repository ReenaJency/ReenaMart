<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Successful - ReenaMart</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f5;
color:#222;
text-align:center
}

header{
background:#1f4d3a;
color:white;
padding:25px
}

.logo{
font-size:26px;
font-weight:bold
}

header p{
margin:8px 0 0
}

.success-box{
background:white;
width:90%;
max-width:700px;
margin:50px auto;
padding:40px 25px;
border-radius:12px;
box-shadow:0 2px 10px #ccc
}

.success-icon{
font-size:70px
}

h1{
color:#1f4d3a
}

.message{
color:#555;
line-height:1.6
}

.order-details{
background:#f3f3f3;
padding:20px;
margin:25px 0;
border-radius:8px;
text-align:left
}

.detail-row{
display:flex;
justify-content:space-between;
gap:15px;
padding:10px 0;
border-bottom:1px solid #ddd
}

.detail-row:last-child{
border-bottom:none
}

.detail-label{
font-weight:bold
}

.status{
color:#1f4d3a;
font-weight:bold
}

.total{
color:#1f4d3a;
font-size:20px;
font-weight:bold
}

.buttons{
margin-top:25px
}

.home-button,
.products-button,
.history-button{
display:inline-block;
text-decoration:none;
padding:13px 22px;
border-radius:6px;
margin:7px;
font-weight:bold
}

.home-button{
background:#1f4d3a;
color:white
}

.products-button{
background:#f5a623;
color:#222
}

.history-button{
background:#555;
color:white
}

footer{
background:#222;
color:white;
padding:20px;
margin-top:50px
}

footer p{
margin:5px
}

.empty{
text-align:center;
padding:15px
}

@media(max-width:600px){

.success-box{
width:95%;
padding:30px 18px
}

.detail-row{
flex-direction:column;
gap:5px
}

.home-button,
.products-button,
.history-button{
display:block;
margin:10px 0
}

}
</style>
</head>

<body>

<header>

<div class="logo">
🛍️ RM | ReenaMart
</div>

<p>
Shop Smart. Live Better.
</p>

</header>

<div class="success-box">

<div class="success-icon">
✅
</div>

<h1>
Order Placed Successfully!
</h1>

<p class="message">
Thank you for shopping with ReenaMart.
<br>
Your order has been successfully placed.
</p>

<div class="order-details" id="orderDetails"></div>

<p>
📦 Your order will be delivered soon.
</p>

<div class="buttons">

<a href="products.html" class="products-button">
🛍️ Continue Shopping
</a>

<a href="orders.html" class="history-button">
📦 View My Orders
</a>

<a href="index.html" class="home-button">
🏠 Back to Home
</a>

</div>

</div>

<footer>

<p>© 2026 ReenaMart</p>

<p>Shop Smart. Live Better.</p>

</footer>

<script>

function getLatestOrder(){

const latest=localStorage.getItem("latestOrder");

if(latest){

try{
return JSON.parse(latest);
}catch(e){}
}

const orders=
JSON.parse(localStorage.getItem("orders")) || [];

if(orders.length>0){
return orders[orders.length-1];
}

return null;
}

const order=getLatestOrder();

const details=
document.getElementById("orderDetails");

if(!order){

details.innerHTML=`

<div class="empty">

<h3>Order Details Not Found</h3>

<p>
Please place an order first.
</p>

</div>

`;

}else{

let products=[];

if(Array.isArray(order.products)){

products=order.products;

}else if(Array.isArray(order.items)){

products=order.items;

}else if(order.product){

products=[order.product];

}

let productHTML="";

if(products.length>0){

products.forEach(item=>{

const quantity=
Number(item.quantity || item.qty || 1);

productHTML+=`

<div class="detail-row">

<span class="detail-label">
Product
</span>

<span>
${item.name || "Product"}
× ${quantity}
</span>

</div>

`;

});

}else{

productHTML=`

<div class="detail-row">

<span class="detail-label">
Product
</span>

<span>
Order products
</span>

</div>

`;

}

const orderId=
order.orderId ||
order.id ||
"RM"+Date.now();

const orderDate=
order.date ||
order.orderDate ||
order.createdAt ||
new Date().toLocaleString("en-IN");

const payment=
order.paymentMethod ||
order.payment ||
"Not specified";

const customer=
order.customerName ||
order.name ||
order.username ||
"Customer";

const status=
order.status ||
"PLACED";

const total=
Number(
order.total ||
order.totalAmount ||
order.amount ||
0
);

details.innerHTML=`

<div class="detail-row">

<span class="detail-label">
Order ID
</span>

<span>
${orderId}
</span>

</div>

${productHTML}

<div class="detail-row">

<span class="detail-label">
Order Date
</span>

<span>
${orderDate}
</span>

</div>

<div class="detail-row">

<span class="detail-label">
Payment
</span>

<span>
${payment}
</span>

</div>

<div class="detail-row">

<span class="detail-label">
Customer
</span>

<span>
${customer}
</span>

</div>

<div class="detail-row">

<span class="detail-label">
Status
</span>

<span class="status">
${status}
</span>

</div>

<div class="detail-row">

<span class="detail-label">
Total Amount
</span>

<span class="total">
₹${total.toLocaleString("en-IN")}
</span>

</div>

`;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - Reena Mart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f5;
            text-align: center;
        }

        header {
            background-color: #1f4d3a;
            color: white;
            padding: 25px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .success-box {
            background-color: white;
            width: 90%;
            max-width: 600px;
            margin: 60px auto;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        .success-icon {
            font-size: 70px;
        }

        h1 {
            color: #1f4d3a;
        }

        .order-number {
            background-color: #f3f3f3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .home-button,
        .products-button {
            display: inline-block;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .home-button {
            background-color: #1f4d3a;
            color: white;
        }

        .products-button {
            background-color: #f5a623;
            color: #222;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🛍️ RM | Reena Mart</div>
        <p>Shop Smart. Live Better.</p>
    </header>

    <div class="success-box">

        <div class="success-icon">✅</div>

        <h1>Order Placed Successfully!</h1>

        <p>Thank you for shopping with Reena Mart.</p>

        <p>Your order has been successfully placed.</p>

        <div class="order-number">
            <strong>Order ID:</strong> RM20260001
        </div>

        <p>📦 Your order will be delivered soon.</p>

        <a href="products.html" class="products-button">
            Continue Shopping
        </a>

        <br>

        <a href="index.html" class="home-button">
            Back to Home
        </a>

    </div>

    <footer>
        <p>© 2026 Reena Mart</p>
        <p>Shop Smart. Live Better.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">ReenaMart</div>

    <nav class="nav">
        <a href="products.html">Products</a>
        <a href="order-history.html">My Orders</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<main class="container">

    <h1>Order Details</h1>

    <div id="orderDetails" class="box">
        <p>Loading order details...</p>
    </div>

    <br>

    <a class="btn" href="order-history.html">
        Back to My Orders
    </a>

    <a class="btn" href="products.html">
        Continue Shopping
    </a>

</main>

<script>
    async function loadOrderDetails() {
        const container = document.getElementById("orderDetails");
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("id");

        if (!orderId) {
            container.innerHTML = "<p>Order ID was not provided.</p>";
            return;
        }

        try {
            const response = await fetch("http://localhost:8080/api/orders");

            if (!response.ok) {
                throw new Error("Unable to load orders.");
            }

            const orders = await response.json();

            const order = orders.find(item =>
                String(item.id) === orderId ||
                String(item.orderId) === orderId
            );

            if (!order) {
                container.innerHTML = "<p>Order not found.</p>";
                return;
            }

            container.innerHTML = `
                <h2>Order #${order.orderId ?? order.id}</h2>

                <p>
                    <strong>Status:</strong>
                    ${order.status ?? "PLACED"}
                </p>

                <p>
                    <strong>Order Date:</strong>
                    ${order.orderDate ? new Date(order.orderDate).toLocaleString() : "Not available"}
                </p>

                <p>
                    <strong>Total Amount:</strong>
                    ₹${Number(order.total ?? 0).toFixed(2)}
                </p>

                <br>

                <a class="btn"
                   href="tracking.html?id=${encodeURIComponent(order.id ?? order.orderId)}">
                   Track This Order
                </a>
            `;

        } catch (error) {
            container.innerHTML = `
                <div class="notice">
                    <p>Unable to load order details.</p>
                    <p>Check the Spring Boot backend and order API.</p>
                </div>
            `;
        }
    }

    document.addEventListener("DOMContentLoaded", loadOrderDetails);
</script>

<script src="../js/script.js"></script>

</body>
</html>

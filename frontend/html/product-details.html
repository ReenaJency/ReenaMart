<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReenaMart - Product Details</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#333
}

header{
background:#1f4d3a;
color:white;
padding:15px 6%;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
flex-wrap:wrap
}

.logo{
font-size:25px;
font-weight:bold
}

nav{
display:flex;
gap:20px;
align-items:center
}

nav a{
color:white;
text-decoration:none;
font-weight:bold
}

.cart{
background:#f5a623;
color:#111;
padding:8px 14px;
border-radius:20px
}

.container{
max-width:1100px;
margin:40px auto;
padding:20px
}

.product-box{
background:white;
border-radius:15px;
padding:30px;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
box-shadow:0 5px 20px rgba(0,0,0,.08)
}

.image-box{
display:flex;
align-items:center;
justify-content:center;
background:#f8f8f8;
border-radius:12px;
min-height:420px
}

.image-box img{
max-width:100%;
max-height:400px;
object-fit:contain;
border-radius:10px
}

.info h1{
font-size:32px;
margin-bottom:15px;
color:#1f4d3a
}

.category{
display:inline-block;
background:#e8f2ed;
color:#1f4d3a;
padding:7px 14px;
border-radius:20px;
font-size:14px;
font-weight:bold;
margin-bottom:20px
}

.description{
line-height:1.7;
margin-bottom:20px;
color:#555
}

.price-box{
margin:20px 0
}

.old-price{
text-decoration:line-through;
color:#888;
font-size:18px;
margin-right:10px
}

.final-price{
font-size:30px;
font-weight:bold;
color:#1f4d3a
}

.discount{
color:#d35400;
font-weight:bold;
margin-top:8px
}

.stock{
font-weight:bold;
margin:20px 0
}

.in-stock{
color:green
}

.out-stock{
color:red
}

.size-title{
font-weight:bold;
margin:20px 0 10px
}

.sizes{
display:flex;
gap:8px;
flex-wrap:wrap
}

.size{
border:1px solid #aaa;
padding:9px 15px;
border-radius:6px;
cursor:pointer;
background:white
}

.size.active{
background:#1f4d3a;
color:white;
border-color:#1f4d3a
}

.buttons{
display:flex;
gap:12px;
margin-top:25px;
flex-wrap:wrap
}

button{
border:none;
padding:13px 22px;
border-radius:7px;
font-size:16px;
font-weight:bold;
cursor:pointer
}

.add-btn{
background:#1f4d3a;
color:white
}

.buy-btn{
background:#f5a623;
color:#111
}

.like-btn{
background:#eee;
color:#333
}

button:disabled{
background:#aaa;
color:white;
cursor:not-allowed
}

.share{
margin-top:25px
}

.share button{
background:#eee;
padding:9px 15px;
margin:5px
}

.message{
text-align:center;
padding:80px 20px
}

.message h2{
color:#1f4d3a;
margin-bottom:15px
}

@media(max-width:768px){
.product-box{
grid-template-columns:1fr;
padding:20px
}

.image-box{
min-height:300px
}

.info h1{
font-size:25px
}

header{
justify-content:center
}

nav{
gap:12px
}

.container{
margin:20px auto
}
}
</style>
</head>

<body>

<header>
<div class="logo">ReenaMart</div>

<nav>
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="cart.html" class="cart">
Cart (<span id="cartCount">0</span>)
</a>
</nav>
</header>

<div class="container">

<div id="productContainer"></div>

</div>

<script>

let product=null;

function getProducts(){
return JSON.parse(localStorage.getItem("sellerProducts")) || [];
}

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function updateCartCount(){
const cart=getCart();

const count=cart.reduce((total,item)=>{
return total+Number(item.quantity || item.qty || 1);
},0);

document.getElementById("cartCount").textContent=count;
}

function getSellingPrice(product){
return Number(product.sellingPrice ?? product.price ?? 0);
}

function getDiscount(product){
const discount=Number(product.discount ?? 0);
return Math.max(discount,0);
}

function getFinalPrice(product){

const storedFinal=Number(product.finalPrice);

if(Number.isFinite(storedFinal) && storedFinal>=0){
return storedFinal;
}

const sellingPrice=getSellingPrice(product);
const discount=getDiscount(product);

return Math.max(
sellingPrice-(sellingPrice*discount/100),
0
);
}

function getStock(product){
return Number(product.stock ?? product.quantity ?? 0);
}

function formatPrice(price){
return "₹"+Number(price).toFixed(2);
}

function getSelectedProduct(){

const saved=localStorage.getItem("selectedProduct");

if(saved){
try{
return JSON.parse(saved);
}catch(e){}
}

const params=new URLSearchParams(window.location.search);
const id=params.get("id");

if(!id) return null;

const products=getProducts();

return products.find(p=>String(p.id)===String(id)) || null;
}

function displayProduct(){

product=getSelectedProduct();

const container=document.getElementById("productContainer");

if(!product){

container.innerHTML=`
<div class="message">
<h2>Product Not Found</h2>
<p>The selected product is not available.</p>
<br>
<button onclick="location.href='products.html'">
Back to Products
</button>
</div>`;

return;
}

const sellingPrice=getSellingPrice(product);
const discount=getDiscount(product);
const finalPrice=getFinalPrice(product);
const stock=getStock(product);

const image=product.image ||
product.imageUrl ||
"https://via.placeholder.com/500x500?text=ReenaMart";

let priceHTML="";

if(discount>0 && sellingPrice>finalPrice){

priceHTML=`
<span class="old-price">${formatPrice(sellingPrice)}</span>
<span class="final-price">${formatPrice(finalPrice)}</span>
<div class="discount">${discount}% OFF</div>
`;

}else{

priceHTML=`
<span class="final-price">${formatPrice(finalPrice)}</span>
`;

}

let stockHTML="";

if(stock>0){

stockHTML=`
<div class="stock in-stock">
✓ In Stock: ${stock}
</div>
`;

}else{

stockHTML=`
<div class="stock out-stock">
✕ Out of Stock
</div>
`;

}

let sizeHTML="";

if(String(product.category || "").toLowerCase()==="fashion"){

const sizes=["XS","S","M","L","XL","XXL"];

sizeHTML=`
<div class="size-title">Select Size</div>
<div class="sizes">

${sizes.map(size=>`
<button
class="size"
onclick="selectSize(this,'${size}')">
${size}
</button>
`).join("")}

</div>
`;

}

container.innerHTML=`

<div class="product-box">

<div class="image-box">
<img
src="${image}"
alt="${product.name || "Product"}"
onerror="this.src='https://via.placeholder.com/500x500?text=ReenaMart'">
</div>

<div class="info">

<div class="category">
${product.category || "Product"}
</div>

<h1>${product.name || "Unnamed Product"}</h1>

<p class="description">
${product.description || "Quality product available at ReenaMart."}
</p>

<div class="price-box">
${priceHTML}
</div>

${stockHTML}

${sizeHTML}

<div class="buttons">

<button
id="addButton"
class="add-btn"
onclick="addToCart()"
${stock<=0 ? "disabled" : ""}>
Add to Cart
</button>

<button
id="buyButton"
class="buy-btn"
onclick="buyNow()"
${stock<=0 ? "disabled" : ""}>
Buy Now
</button>

<button
class="like-btn"
onclick="likeProduct()"
id="likeButton">
♡ Like
</button>

</div>

<div class="share">

<strong>Share:</strong>

<button onclick="shareProduct('whatsapp')">
WhatsApp
</button>

<button onclick="shareProduct('copy')">
Copy Link
</button>

</div>

</div>

</div>
`;

updateLikeButton();
}

function selectSize(button,size){

document.querySelectorAll(".size").forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

localStorage.setItem("selectedSize",size);
}

function addToCart(){

if(!product) return;

const stock=getStock(product);

if(stock<=0){

alert("This product is currently out of stock.");
return;
}

const selectedSize=
localStorage.getItem("selectedSize") || "";

if(
String(product.category || "").toLowerCase()==="fashion"
&& !selectedSize
){

alert("Please select a size.");
return;
}

let cart=getCart();

const productId=String(product.id);

const existing=cart.find(item=>
String(item.id)===productId &&
String(item.selectedSize || "")===selectedSize
);

if(existing){

const currentQty=Number(existing.quantity || 1);

if(currentQty>=stock){

alert(`Only ${stock} item(s) available in stock.`);
return;
}

existing.quantity=currentQty+1;

}else{

cart.push({
...product,
quantity:1,
selectedSize:selectedSize
});

}

localStorage.setItem("cart",JSON.stringify(cart));

updateCartCount();

alert("Product added to cart successfully!");
}

function buyNow(){

if(!product) return;

const stock=getStock(product);

if(stock<=0){

alert("This product is currently out of stock.");
return;
}

const selectedSize=
localStorage.getItem("selectedSize") || "";

if(
String(product.category || "").toLowerCase()==="fashion"
&& !selectedSize
){

alert("Please select a size.");
return;
}

const buyProduct={
...product,
quantity:1,
selectedSize:selectedSize
};

localStorage.setItem(
"buyNowProduct",
JSON.stringify(buyProduct)
);

window.location.href="checkout.html";
}

function getLikedProducts(){

return JSON.parse(
localStorage.getItem("likedProducts")
) || [];
}

function likeProduct(){

if(!product) return;

let liked=getLikedProducts();

const id=String(product.id);

const index=liked.findIndex(
item=>String(item)===id
);

if(index===-1){

liked.push(product.id);
alert("Product liked!");

}else{

liked.splice(index,1);
alert("Product unliked!");
}

localStorage.setItem(
"likedProducts",
JSON.stringify(liked)
);

updateLikeButton();
}

function updateLikeButton(){

const button=document.getElementById("likeButton");

if(!button || !product) return;

const liked=getLikedProducts();

const exists=liked.some(
item=>String(item)===String(product.id)
);

button.textContent=
exists ? "♥ Liked" : "♡ Like";
}

function shareProduct(type){

if(!product) return;

const url=
window.location.origin+
window.location.pathname+
"?id="+encodeURIComponent(product.id);

if(type==="whatsapp"){

const text=
encodeURIComponent(
`Check out ${product.name} on ReenaMart: ${url}`
);

window.open(
"https://wa.me/?text="+text,
"_blank"
);

}

if(type==="copy"){

navigator.clipboard.writeText(url)
.then(()=>{
alert("Product link copied!");
})
.catch(()=>{
prompt("Copy this link:",url);
});

}
}

updateCartCount();
displayProduct();

</script>

</body>
</html>

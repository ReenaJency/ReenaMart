<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Seller Products - ReenaMart</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        ReenaMart Seller
    </div>

    <nav class="nav">

        <a href="seller-dashboard.html">
            Dashboard
        </a>

        <a href="seller-orders.html">
            Orders
        </a>

        <button onclick="sellerLogout()">
            Logout
        </button>

    </nav>

</header>

<main class="container">

<div class="form-box">

    <h1>Add Product</h1>

    <div class="notice">
        Seller should enter <strong>only Seller Price</strong>.<br>
        Cost Price, Selling Price, Discount and Final Price are set by Admin on approval.
        <div style="margin-top: 12px;">
            <button type="button" class="btn small orange" onclick="fillSampleProduct()" style="cursor: pointer;">
                ⚡ Fill Sample Product (1-Click Test)
            </button>
        </div>
    </div>

    <form id="sellerProductForm">

        <label>Product Name</label>

        <input
            id="productName"
            required
        >

        <label>Description</label>

        <textarea
            id="description"
        ></textarea>

        <label>Seller Price</label>

        <input
            id="sellerPrice"
            type="number"
            min="1"
            required
        >

        <label>Category</label>

        <select
            id="category"
            required
        >

            <option value="Fashion">
                Fashion
            </option>

            <option value="Jewellery">
                Jewellery
            </option>

            <option value="Electronics">
                Electronics
            </option>

            <option value="Beauty">
                Beauty
            </option>

        </select>

        <label>Image URL</label>

        <input id="imageUrl">

        <label>Sizes</label>

        <input
            id="sizes"
            placeholder="S,M,L,XL,XXL"
        >

        <label>Shop Name</label>

        <input
            id="shopName"
            required
        >

        <label>Stock</label>

        <input
            id="stock"
            type="number"
            min="1"
            required
        >

        <button
            class="btn full"
            type="submit"
        >
            Submit for Admin Approval
        </button>

    </form>

</div>

<h2>My Products</h2>

<div id="sellerProducts"></div>

</main>

<script src="../js/script.js"></script>

<script>
initSellerProducts();
</script>

</body>
</html>

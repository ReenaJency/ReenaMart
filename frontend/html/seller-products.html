<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Products - ReenaMart</title>

<style>

*{
    box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif
 }

body{
    background:#f5f7f6;color:#333
}
header{
    background:#1f4d3a;color:white;padding:18px 40px;display:flex;justify-content:space-between;align-items:center
}
header h1{
    font-size:25px
}
header a{
    color:white;text-decoration:none;margin-left:20px
}
.container{
    width:90%;max-width:1100px;margin:30px auto
}
.top-section{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:25px
}
.top-section h2{
    color:#1f4d3a
}
button{
    border:none;cursor:pointer;padding:10px 18px;border-radius:6px;font-size:14px
}
.add-btn{
    background:#f5a623;color:white
}
.save-btn{
    background:#1f4d3a;color:white
}
.cancel-btn{
    background:#777;color:white;margin-left:5px
}
.edit-btn{
    background:#3498db;color:white;margin-right:5px
}
.delete-btn{
    background:#e74c3c;color:white
}
.form-container{
    background:white;padding:25px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:30px;display:none
}
.form-container h3{
    color:#1f4d3a;margin-bottom:20px
}
.form-group{
    margin-bottom:18px
}
.form-group label{
    display:block;margin-bottom:7px;font-weight:bold
}
.form-group input,.form-group select{
    width:100%;padding:11px;border:1px solid #ccc;border-radius:6px;font-size:15px
}
.form-buttons{
    margin-top:20px
}
.products-container{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px
}
.product-card{
    background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)
}
.product-card img{
    width:100%;height:200px;object-fit:cover;background:#eee
}
.product-info{
    padding:15px
}
.product-info h3{
    color:#1f4d3a;margin-bottom:8px
}
.category,.size{
    color:#777;font-size:14px;margin-bottom:6px
}
.price{
    color:#e67e22;font-size:18px;font-weight:bold;margin-bottom:12px
}
.actions{
    margin-top:10px
}
.empty-message{
    text-align:center;padding:40px;background:white;border-radius:10px;color:#777
}
@media(max-width:600px)
{
header{
    padding:15px 20px;flex-direction:column;gap:10px
}
.container{
    width:94%
}
.top-section{
    flex-direction:column;gap:15px;align-items:flex-start
}
}
</style>
</head>
<body>

<header>
<h1>ReenaMart Seller Dashboard</h1>
<nav>
<a href="index.html">Home</a>
<a href="products.html">Products</a>
</nav>
</header>

<div class="container">
<div class="top-section">
<h2>Manage Products</h2>
<button class="add-btn" onclick="showForm()">+ Add Product</button>
</div>

<div class="form-container" id="productForm">
<h3 id="formTitle">Add New Product</h3>

<div class="form-group">
<label for="productName">Product Name</label>
<input type="text" id="productName" placeholder="Enter product name">
</div>

<div class="form-group">
<label for="productCategory">Category</label>
<select id="productCategory" onchange="toggleSizeField()">
<option value="">Select Category</option>
<option value="Fashion">Fashion</option>
<option value="Jewellery">Jewellery</option>
<option value="Electronics">Electronics</option>
<option value="Beauty">Beauty</option>
</select>
</div>

<div class="form-group" id="sizeGroup" style="display:none">
<label for="productSize">Size</label>
<select id="productSize">
<option value="">Select Size</option>
<option value="S">S</option>
<option value="M">M</option>
<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option>
</select>
</div>

<div class="form-group">
<label for="productPrice">Price</label>
<input type="number" id="productPrice" placeholder="Enter price" min="1">
</div>

<div class="form-group">
<label for="productImage">Image URL</label>
<input type="text" id="productImage" placeholder="Enter image URL">
</div>

<div class="form-buttons">
<button class="save-btn" onclick="saveProduct()">Save Product</button>
<button class="cancel-btn" onclick="hideForm()">Cancel</button>
</div>
</div>

<div class="products-container" id="productsContainer"></div>
</div>

<script>
let products=JSON.parse(localStorage.getItem("sellerProducts"))||[];
let editId=null;

if(products.length===0){
products=[
{id:1,name:"Girls Dress",category:"Fashion",size:"M",price:899,image:"https://images.unsplash.com/photo-1595777457583-95e059d581b8"},
{id:2,name:"Boys Dress",category:"Fashion",size:"L",price:799,image:"https://images.unsplash.com/photo-1519238263530-99bdd11df2ea"},
{id:3,name:"Crop Top",category:"Fashion",size:"M",price:499,image:"https://images.unsplash.com/photo-1564257577054-4b6c9f9e3b58"},
{id:4,name:"Open Top",category:"Fashion",size:"S",price:599,image:"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3"},
{id:5,name:"T Shirt",category:"Fashion",size:"XL",price:449,image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"},
{id:6,name:"Black Pant",category:"Fashion",size:"L",price:699,image:"https://images.unsplash.com/photo-1541099649105-f69ad21f3246"},
{id:7,name:"Blue Jeans",category:"Fashion",size:"XL",price:999,image:"https://images.unsplash.com/photo-1542272604-787c3835535d"},
{id:8,name:"Bangles",category:"Jewellery",size:"",price:299,image:"https://images.unsplash.com/photo-1535632066927-ab7c9ab60908"},
{id:9,name:"Earrings",category:"Jewellery",size:"",price:399,image:"https://images.unsplash.com/photo-1535632787350-4e68ef0ac584"},
{id:10,name:"Chain",category:"Jewellery",size:"",price:599,image:"https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f"},
{id:11,name:"Necklace",category:"Jewellery",size:"",price:799,image:"https://images.unsplash.com/photo-1611652022419-a9419f74343d"},
{id:12,name:"Ring",category:"Jewellery",size:"",price:499,image:"https://images.unsplash.com/photo-1605100804763-247f67b3557e"},
{id:13,name:"Laptop",category:"Electronics",size:"",price:55000,image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853"},
{id:14,name:"Wireless Mouse",category:"Electronics",size:"",price:799,image:"https://images.unsplash.com/photo-1527814050087-3793815479db"},
{id:15,name:"Keyboard",category:"Electronics",size:"",price:1299,image:"https://images.unsplash.com/photo-1587829741301-dc798b83add3"},
{id:16,name:"Wireless Earbuds",category:"Electronics",size:"",price:1499,image:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df"},
{id:17,name:"Smart Watch",category:"Electronics",size:"",price:1999,image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30"},
{id:18,name:"Lipstick",category:"Beauty",size:"",price:499,image:"https://images.unsplash.com/photo-1586495777744-4413f21062fa"},
{id:19,name:"Lip Balm",category:"Beauty",size:"",price:199,image:"https://images.unsplash.com/photo-1620916566398-39f1143ab7be"},
{id:20,name:"Face Wash",category:"Beauty",size:"",price:299,image:"https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8"}
];
localStorage.setItem("sellerProducts",JSON.stringify(products));
}

function toggleSizeField(){
const category=document.getElementById("productCategory").value;
const sizeGroup=document.getElementById("sizeGroup");
const size=document.getElementById("productSize");
if(category==="Fashion"){
sizeGroup.style.display="block";
}else{
sizeGroup.style.display="none";
size.value="";
}
}

function showForm(){
document.getElementById("productForm").style.display="block";
document.getElementById("formTitle").innerText="Add New Product";
clearForm();
editId=null;
window.scrollTo({top:0,behavior:"smooth"});
}

function hideForm(){
document.getElementById("productForm").style.display="none";
clearForm();
editId=null;
}

function clearForm(){
document.getElementById("productName").value="";
document.getElementById("productCategory").value="";
document.getElementById("productSize").value="";
document.getElementById("productPrice").value="";
document.getElementById("productImage").value="";
document.getElementById("sizeGroup").style.display="none";
}

function saveProduct(){
const name=document.getElementById("productName").value.trim();
const category=document.getElementById("productCategory").value;
const size=document.getElementById("productSize").value;
const price=document.getElementById("productPrice").value;
const image=document.getElementById("productImage").value.trim();

if(name===""){
alert("Please enter product name.");
return;
}

if(category===""){
alert("Please select a category.");
return;
}

if(category==="Fashion"&&size===""){
alert("Please select a size for Fashion product.");
return;
}

if(price===""||Number(price)<=0){
alert("Please enter a valid price.");
return;
}

if(editId!==null){
const product=products.find(item=>item.id===editId);
if(product){
product.name=name;
product.category=category;
product.size=category==="Fashion"?size:"";
product.price=Number(price);
if(image!==""){
product.image=image;
}
}
}else{
const newProduct={
id:Date.now(),
name:name,
category:category,
size:category==="Fashion"?size:"",
price:Number(price),
image:image||"https://via.placeholder.com/400x300?text=No+Image"
};
products.push(newProduct);
}

localStorage.setItem("sellerProducts",JSON.stringify(products));
displayProducts();
hideForm();
alert("Product saved successfully!");
}

function editProduct(id){
const product=products.find(item=>item.id===id);
if(!product)return;

editId=id;
document.getElementById("productName").value=product.name||"";
document.getElementById("productCategory").value=product.category||"";
document.getElementById("productSize").value=product.size||"";
document.getElementById("productPrice").value=product.price||"";
document.getElementById("productImage").value=product.image||"";
document.getElementById("formTitle").innerText="Edit Product";

toggleSizeField();

document.getElementById("productForm").style.display="block";
window.scrollTo({top:0,behavior:"smooth"});
}

function deleteProduct(id){
const confirmDelete=confirm("Are you sure you want to delete this product?");
if(!confirmDelete)return;

products=products.filter(product=>product.id!==id);
localStorage.setItem("sellerProducts",JSON.stringify(products));
displayProducts();
}

function displayProducts(){
const container=document.getElementById("productsContainer");
container.innerHTML="";

if(products.length===0){
container.innerHTML=`
<div class="empty-message">
<h3>No Products Found</h3>
<p>Click "Add Product" to add your first product.</p>
</div>`;
return;
}

products.forEach(product=>{
const card=document.createElement("div");
card.className="product-card";

const image=product.image||"https://via.placeholder.com/400x300?text=No+Image";

let sizeHTML="";

if(product.category==="Fashion"){
sizeHTML=`
<div class="size">
<strong>Size:</strong> ${product.size||"Not set"}
</div>`;
}

card.innerHTML=`
<img src="${image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">

<div class="product-info">
<h3>${product.name}</h3>

<div class="category">
<strong>Category:</strong> ${product.category}
</div>

${sizeHTML}

<div class="price">
₹${Number(product.price).toLocaleString("en-IN")}
</div>

<div class="actions">
<button class="edit-btn" onclick="editProduct(${product.id})">Edit</button>
<button class="delete-btn" onclick="deleteProduct(${product.id})">Delete</button>
</div>
</div>`;

container.appendChild(card);
});
}

displayProducts();
</script>

</body>
</html>

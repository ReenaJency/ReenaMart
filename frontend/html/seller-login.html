
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login | ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">ReenaMart Seller</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="seller-register.html">Register</a>
    </nav>
</header>

<main class="container">
    <div class="form-box">
        <h1>Seller Login</h1>
        <p class="center">Welcome back to ReenaMart!</p>

        <div class="notice" style="margin: 15px 0; font-size: 13px; background: #eef7f2; border-left: 4px solid var(--green, #1f4d3a);">
            <strong>Demo / Active Seller:</strong><br>
            Email: <code>psn20080@gmail.com</code> | Password: <code>password123</code>
            <br>
            <button type="button" class="btn small" style="margin-top: 6px; padding: 4px 10px; font-size: 11px;" onclick="document.getElementById('email').value='psn20080@gmail.com'; document.getElementById('password').value='password123';">
                ⚡ Auto-fill Account
            </button>
        </div>

        <form id="sellerLoginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button class="btn full" type="submit">
                Login as Seller
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <p class="center">
            New seller?
            <a href="seller-register.html">Create an account</a>
        </p>

        <p class="center">
            <a href="index.html">Back to Home</a>
        </p>
    </div>
</main>

<script src="../js/script.js"></script>
<script>
    initSellerLogin();
</script>

</body>
</html>

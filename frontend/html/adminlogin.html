<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReenaMart - Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7f5;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            color: #1f4d3a;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f4d3a;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1f4d3a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #163a2c;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-bottom: 20px;
            color: #1f4d3a;
            text-decoration: none;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f4d3a;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-note {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">ReenaMart</div>

        <div class="title">Admin Login</div>

        <form id="adminLoginForm">

            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                required
            >

            <a href="#" class="forgot">Forgot Password?</a>

            <button type="submit" class="login-btn">
                Login as Admin
            </button>

        </form>

        <a href="role.html" class="back">
            ← Back to Role Selection
        </a>

        <div class="admin-note">
            Authorized administrators only
        </div>

    </div>

    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            // Temporary admin login for testing
            const adminEmail = "admin@reenamart.com";
            const adminPassword = "admin123";

            if (email === adminEmail && password === adminPassword) {
                localStorage.setItem("adminLoggedIn", "true");
                localStorage.setItem("userRole", "ADMIN");

                alert("Admin login successful!");

                window.location.href = "admin.html";
            } else {
                alert("Invalid admin email or password.");
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="topbar">
    <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">ReenaMart Admin</a></div>
    <nav class="nav">
        <a href="index.html">Store Home</a>
        <a href="products.html">Products</a>
    </nav>
</header>

<main class="container">
    <div class="form-box" style="max-width: 460px; margin: 40px auto;">
        <h1 class="center" style="color: var(--green, #1f4d3a); margin-bottom: 6px;">Administrator Login</h1>

        <p class="center" style="color: #666; margin-bottom: 20px;">
            Secure portal for ReenaMart store management
        </p>

        <!-- Admin Credentials Info Card -->
        <div class="notice" style="background: #eef6f3; border-left: 4px solid var(--green, #1f4d3a); padding: 14px 18px; border-radius: 8px; margin-bottom: 22px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px;">
                <div>
                    <h3 style="margin: 0 0 6px 0; color: var(--green, #1f4d3a); font-size: 15px;">🔑 Admin Credentials</h3>
                    <div style="font-size: 14px; color: #333; line-height: 1.6;">
                        <strong>Email:</strong> <code style="background: #fff; padding: 2px 6px; border-radius: 4px; border: 1px solid #ddd; font-weight: bold;">admin@gmail.com</code><br>
                        <strong>Password:</strong> <code style="background: #fff; padding: 2px 6px; border-radius: 4px; border: 1px solid #ddd; font-weight: bold;">123456</code>
                    </div>
                </div>
                <button
                    type="button"
                    class="btn small orange"
                    onclick="autoFillAdmin()"
                    style="cursor: pointer; font-weight: 700; padding: 8px 14px; font-size: 13px;">
                    ⚡ Auto-fill Login
                </button>
            </div>
        </div>

        <form id="adminLoginForm">
            <label for="email" style="font-weight: 600;">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="admin@gmail.com"
                autocomplete="username"
                required
                style="margin-bottom: 14px;"
            >

            <label for="password" style="font-weight: 600;">Password</label>
            <div style="position: relative; margin-bottom: 20px;">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                    style="width: 100%; padding-right: 40px;"
                >
                <button
                    type="button"
                    onclick="toggleAdminPassword()"
                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; color: #666;"
                    title="Toggle password visibility">
                    👁️
                </button>
            </div>

            <button class="btn full" type="submit" style="padding: 12px; font-size: 16px; font-weight: 700;">
                Admin Login
            </button>
        </form>

        <div id="message" role="status" aria-live="polite" style="margin-top: 15px;"></div>

        <div style="margin-top: 25px; text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
            <p style="font-size: 13px; color: #777;">
                Need to access other portals?
                <br>
                <a href="seller-login.html" style="color: var(--green, #1f4d3a); font-weight: 600;">Seller Portal</a> •
                <a href="login.html" style="color: var(--green, #1f4d3a); font-weight: 600;">Buyer Login</a>
            </p>
        </div>
    </div>
</main>

<script src="../js/script.js"></script>
<script>
    function autoFillAdmin() {
        const email = document.getElementById("email");
        const pass = document.getElementById("password");
        if (email) email.value = "admin@gmail.com";
        if (pass) pass.value = "123456";
        if (typeof showMessage === "function") {
            showMessage("Admin credentials auto-filled! Click 'Admin Login'.", "info");
        }
    }

    function toggleAdminPassword() {
        const pass = document.getElementById("password");
        if (pass) {
            pass.type = pass.type === "password" ? "text" : "password";
        }
    }

    window.autoFillAdmin = autoFillAdmin;
    window.toggleAdminPassword = toggleAdminPassword;

    document.addEventListener("DOMContentLoaded", function() {
        if (typeof initAdminLogin === "function") {
            initAdminLogin();
        }
    });
</script>

</body>
</html>

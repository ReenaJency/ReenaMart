<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Orders - ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">ReenaMart Seller</div>

    <nav class="nav">
        <a href="seller.html">Home</a>
        <a href="seller-dashboard.html">Dashboard</a>
        <a href="seller-products.html">Products</a>
        <a href="seller-orders.html">Orders</a>
        <button type="button" onclick="sellerLogout()">Logout</button>
    </nav>
</header>

<main class="container">

    <h1>Seller Orders</h1>

    <p>Check the order information for your shop here.</p>

    <div id="sellerOrders" class="box">
        <p>Loading orders...</p>
    </div>

    <br>

    <a class="btn" href="seller-dashboard.html">
        Back to Dashboard
    </a>

</main>

<script>
    function sellerLogout() {
        localStorage.removeItem("currentUser");
        window.location.href = "seller-login.html";
    }

    async function loadSellerOrders() {
        const container = document.getElementById("sellerOrders");

        try {
            const response = await fetch("http://localhost:8080/api/orders");

            if (!response.ok) {
                throw new Error("Unable to load orders.");
            }

            const orders = await response.json();

            if (!Array.isArray(orders) || orders.length === 0) {
                container.innerHTML = "<p>No orders are available yet.</p>";
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="box">
                    <h3>Order #${order.orderId ?? order.id ?? "N/A"}</h3>
                    <p><strong>Status:</strong> ${order.status ?? "PLACED"}</p>
                    <p><strong>Total:</strong> ₹${Number(order.total ?? 0).toFixed(2)}</p>

                    <a class="btn"
                       href="order-details.html?id=${encodeURIComponent(order.id ?? order.orderId ?? "")}">
                       View Order Details
                    </a>

                    <a class="btn"
                       href="tracking.html?id=${encodeURIComponent(order.id ?? order.orderId ?? "")}">
                       Track Order
                    </a>
                </div>
            `).join("");

        } catch (error) {
            container.innerHTML = `
                <div class="notice">
                    <p>Unable to load orders from the backend.</p>
                    <p>Make sure Spring Boot is running on port 8080.</p>
                </div>
            `;
        }
    }

    document.addEventListener("DOMContentLoaded", loadSellerOrders);
</script>

<script src="../js/script.js"></script>

</body>
</html>

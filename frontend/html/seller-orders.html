.<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Orders - ReenaMart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        /* HEADER */

        header {
            background: #1f4d3a;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: #f5a623;
            color: white;

            padding: 10px 18px;

            border-radius: 6px;

            text-decoration: none;
            font-weight: bold;
        }

        /* MAIN */

        .container {
            width: 92%;
            max-width: 1200px;

            margin: 30px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            color: #1f4d3a;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #777;
        }

        /* ORDER CARD */

        .order-card {
            background: white;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.10);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #ddd;

            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-id {
            font-weight: bold;
            color: #1f4d3a;
        }

        .order-date {
            color: #777;
            font-size: 14px;
        }

        /* PRODUCT */

        .order-product {
            display: flex;
            gap: 20px;

            align-items: center;

            margin-bottom: 15px;
        }

        .product-image {
            width: 100px;
            height: 100px;

            object-fit: cover;

            border-radius: 8px;

            background: #eee;
        }

        .product-details h3 {
            color: #1f4d3a;
            margin-bottom: 7px;
        }

        .product-details p {
            margin-bottom: 5px;
            color: #555;
        }

        /* CUSTOMER */

        .customer-info {
            background: #f8f8f8;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 15px;
        }

        .customer-info strong {
            color: #1f4d3a;
        }

        /* BOTTOM */

        .order-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;

            border-top: 1px solid #ddd;

            padding-top: 15px;
        }

        .total {
            font-size: 19px;
            font-weight: bold;

            color: #e67e22;
        }

        /* STATUS */

        .status-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-section label {
            font-weight: bold;
        }

        .status-select {
            padding: 9px;

            border: 1px solid #ccc;

            border-radius: 5px;

            cursor: pointer;
        }

        .update-btn {
            background: #1f4d3a;
            color: white;

            border: none;

            padding: 9px 15px;

            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;
        }

        .update-btn:hover {
            background: #163a2c;
        }

        /* EMPTY */

        .empty-orders {
            background: white;

            text-align: center;

            padding: 70px 20px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }

        .empty-orders h3 {
            color: #1f4d3a;
            margin-bottom: 10px;
        }

        .empty-orders p {
            color: #777;
        }

        /* MOBILE */

        @media(max-width: 700px) {

            header {
                padding: 15px;
            }

            .container {
                width: 94%;
            }

            .order-header,
            .order-bottom {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .order-product {
                align-items: flex-start;
            }

            .status-section {
                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>
        ReenaMart - Seller
    </h1>

    <a
        href="seller.html"
        class="back-btn">

        ← Seller Dashboard

    </a>

</header>



<!-- MAIN -->

<div class="container">


    <div class="page-title">

        <h2>
            Customer Orders
        </h2>

        <p>
            View and manage orders received for your products.
        </p>

    </div>



    <!-- ORDERS -->

    <div id="ordersContainer"></div>



    <!-- EMPTY ORDERS -->

    <div
        id="emptyOrders"
        class="empty-orders">

        <h3>
            No Orders Yet
        </h3>

        <p>
            When customers place orders for your products,
            they will appear here.
        </p>

    </div>


</div>



<script>


/* =====================================
   LOAD ORDERS
===================================== */

let orders =
    JSON.parse(
        localStorage.getItem("orders")
    ) || [];



/* =====================================
   DISPLAY ORDERS
===================================== */

function displayOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );

    const emptyOrders =
        document.getElementById(
            "emptyOrders"
        );


    container.innerHTML = "";


    if (orders.length === 0) {

        emptyOrders.style.display = "block";

        return;
    }


    emptyOrders.style.display = "none";


    orders.forEach((order, index) => {

        const product =
            order.product || order;


        const quantity =
            order.quantity || 1;


        const price =
            Number(product.price || 0);


        const total =
            price * quantity;


        container.innerHTML += `

            <div class="order-card">

                <div class="order-header">

                    <div>

                        <div class="order-id">
                            Order ID:
                            ${order.orderId || "RM" + (1000 + index)}
                        </div>

                        <div class="order-date">
                            ${order.date || "Recent Order"}
                        </div>

                    </div>

                </div>


                <div class="order-product">

                    <img
                        src="${product.image || ''}"
                        class="product-image"
                        alt="${product.name || 'Product'}"
                        onerror="this.style.display='none'"
                    >


                    <div class="product-details">

                        <h3>
                            ${product.name || "Product"}
                        </h3>

                        <p>
                            Category:
                            ${product.category || "Product"}
                        </p>

                        <p>
                            Quantity:
                            ${quantity}
                        </p>

                        <p>
                            Price:
                            ₹${price}
                        </p>

                    </div>

                </div>


                <div class="customer-info">

                    <strong>
                        Customer Details
                    </strong>

                    <br><br>

                    Name:
                    ${order.customerName || "Customer"}

                    <br>

                    Address:
                    ${order.address || "Address not available"}

                </div>


                <div class="order-bottom">

                    <div class="total">

                        Total:
                        ₹${total}

                    </div>


                    <div class="status-section">

                        <label>
                            Status:
                        </label>


                        <select
                            class="status-select"
                            id="status-${index}">

                            <option value="Pending"
                                ${order.status === "Pending" ? "selected" : ""}>
                                Pending
                            </option>

                            <option value="Confirmed"
                                ${order.status === "Confirmed" ? "selected" : ""}>
                                Confirmed
                            </option>

                            <option value="Shipped"
                                ${order.status === "Shipped" ? "selected" : ""}>
                                Shipped
                            </option>

                            <option value="Delivered"
                                ${order.status === "Delivered" ? "selected" : ""}>
                                Delivered
                            </option>

                        </select>


                        <button
                            class="update-btn"
                            onclick="updateStatus(${index})">

                            Update

                        </button>

                    </div>

                </div>

            </div>

        `;

    });

}



/* =====================================
   UPDATE ORDER STATUS
===================================== */

function updateStatus(index) {

    const select =
        document.getElementById(
            "status-" + index
        );


    const newStatus =
        select.value;


    orders[index].status =
        newStatus;


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    alert(
        "Order status updated to " +
        newStatus
    );


    displayOrders();

}



/* =====================================
   INITIAL LOAD
===================================== */

displayOrders();


</script>


</body>

</html>

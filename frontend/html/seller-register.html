<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration | ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">ReenaMart Seller</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="seller-login.html">Seller Login</a>
    </nav>
</header>

<main class="container">
    <div class="form-box">
        <h1>Seller Registration</h1>
        <p class="center">Create your seller account.</p>

        <form id="sellerRegisterForm">

            <label for="sellerName">Seller Name</label>
            <input
                type="text"
                id="sellerName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="sellerEmail">Email Address</label>
            <input
                type="email"
                id="sellerEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="mobile">Mobile Number</label>
            <input
                type="tel"
                id="mobile"
                placeholder="Enter your mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                inputmode="numeric"
                required
            >

            <label for="otp">Demo OTP</label>
            <input
                type="text"
                id="otp"
                placeholder="Demo OTP (optional)"
                inputmode="numeric"
            >

            <small>
                Demo OTP is for demonstration only. It does not verify
                your mobile number.
            </small>

            <label for="shopName">Shop Name</label>
            <input
                type="text"
                id="shopName"
                placeholder="Enter your shop name"
                required
            >

            <label for="category">Product Category</label>
            <select id="category" required>
                <option value="Fashion">Fashion</option>
                <option value="Jewellery">Jewellery</option>
                <option value="Electronics">Electronics</option>
                <option value="Beauty">Beauty</option>
            </select>

            <label for="password">Create Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button class="btn full" type="submit">
                Register as Seller
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <p class="center">
            Already registered?
            <a href="seller-login.html">Login here</a>
        </p>

        <p class="center">
            <a href="index.html">Back to Home</a>
        </p>
    </div>
</main>

<script src="../js/script.js"></script>
<script>
    initSellerRegister();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">
    <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">ReenaMart</a></div>
    <nav id="nav" class="nav">
        <a href="products.html">Products</a>
        <a href="order-history.html">My Orders</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<main class="container" style="max-width: 800px; margin: 30px auto; padding: 0 15px;">

    <div class="box center" style="padding: 30px 20px;">
        <h1 style="color: var(--green, #1f4d3a); margin-bottom: 8px;">🚚 Live Order Tracking</h1>
        <p style="color: #666; margin-bottom: 20px;">Check the live shipment status and estimated delivery of your order.</p>

        <!-- Search Bar -->
        <div style="display: flex; gap: 8px; max-width: 450px; margin: 0 auto 25px auto;">
            <input
                type="text"
                id="trackSearchInput"
                placeholder="Enter Order ID (e.g. 1, 2, or ORD...)"
                style="flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;"
                onkeydown="if(event.key === 'Enter') searchTracking()"
            />
            <button
                type="button"
                class="btn"
                onclick="searchTracking()"
                style="padding: 10px 18px;">
                Track
            </button>
        </div>

        <p id="trackingOrderId" style="font-size: 16px; color: #444; margin-bottom: 20px;">
            Checking order information...
        </p>

        <!-- Visual Stepper Progress Bar -->
        <div id="trackingStepper" class="tracking-stepper" style="margin: 25px 0 35px 0;"></div>

        <!-- Order Information Box -->
        <div id="trackingDetailsBox"></div>

        <div style="margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a class="btn outline" href="order-history.html">
                📋 Back to My Orders
            </a>
            <a class="btn" href="products.html">
                🛍️ Continue Shopping
            </a>
        </div>
    </div>

</main>

<script src="../js/script.js"></script>
<script src="../js/ai-bot.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reena Mart - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 100%;
            max-width: 400px;

            background-color: white;

            padding: 35px 30px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #2874f0;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        select {
            background-color: white;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background-color: #2874f0;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #1557c0;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .register-link a {
            color: #2874f0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🛍️ Reena Mart</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <div class="form-group">

                <label for="role">
                    Select your role
                </label>

                <select id="role" required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="BUYER">
                        Buyer
                    </option>

                    <option value="SELLER">
                        Seller
                    </option>

                    <option value="ADMIN">
                        Admin
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>


        <div class="register-link">

            New to Reena Mart?

            <a href="register.html">
                Register
            </a>

        </div>

    </div>


    <!-- IMPORTANT: Correct JavaScript path -->

    <script src="../js/script.js"></script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyer Login | ReenaMart</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="topbar">
        <a href="index.html" class="logo">ReenaMart</a>
    </header>

    <main class="container">

        <section class="form-box">

            <h1>Buyer Login</h1>

            <p class="muted">
                Login to your ReenaMart account.
            </p>

            <form id="loginForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="btn full">
                    Login
                </button>

            </form>

            <div
                id="message"
                role="status"
                aria-live="polite"
            ></div>

            <p class="center">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <p class="center" style="margin-top: 15px; font-size: 13px; color: #777;">
                Portal logins:
                <a href="seller-login.html" style="color: var(--green, #1f4d3a); font-weight: 600;">Seller Login</a> •
                <a href="adminlogin.html" style="color: var(--green, #1f4d3a); font-weight: 600;">Admin Login</a>
            </p>

            <p class="center">
                <a href="index.html">Back to Home</a>
            </p>

        </section>

    </main>

    <script src="../js/script.js"></script>

    <script>
        initLogin();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order History - ReenaMart</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif
}

body{
background:#f5f5f5;
color:#333
}

header{
background:#1f4d3a;
color:white;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center
}

header h1{
font-size:25px
}

.shop-btn{
background:#f5a623;
color:#222;
padding:10px 18px;
border-radius:6px;
text-decoration:none;
font-weight:bold
}

.container{
width:92%;
max-width:1100px;
margin:30px auto
}

.page-title{
margin-bottom:25px
}

.page-title h2{
color:#1f4d3a;
margin-bottom:7px
}

.page-title p{
color:#777
}

.order-card{
background:white;
border-radius:10px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 10px rgba(0,0,0,.1)
}

.order-header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
padding-bottom:15px;
margin-bottom:18px
}

.order-id{
color:#1f4d3a;
font-weight:bold
}

.order-date{
color:#777;
font-size:14px
}

.product-area{
display:flex;
gap:20px;
align-items:center;
padding:15px 0;
border-bottom:1px solid #eee
}

.product-image{
width:100px;
height:100px;
object-fit:cover;
border-radius:8px;
background:#eee;
border:1px solid #ddd
}

.product-info{
flex:1
}

.product-info h3{
color:#1f4d3a;
margin-bottom:8px
}

.product-info p{
margin:5px 0;
color:#555
}

.old-price{
text-decoration:line-through;
color:#888;
margin-right:8px
}

.discount{
color:#d35400
}

.product-final{
font-weight:bold;
color:#1f4d3a
}

.order-summary{
background:#f8f8f8;
padding:18px;
margin-top:20px;
border-radius:8px
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:10px
}

.summary-discount{
color:#d35400
}

.final-total{
border-top:1px solid #ddd;
padding-top:12px;
margin-top:12px;
font-size:20px;
font-weight:bold;
color:#1f4d3a
}

.delivery-box{
margin-top:20px;
padding:18px;
border:1px solid #ddd;
border-radius:8px
}

.delivery-box h3{
color:#1f4d3a;
margin-bottom:12px
}

.delivery-box p{
margin:6px 0;
color:#555
}

.payment{
margin-top:15px;
font-weight:bold;
color:#333
}

.order-footer{
border-top:1px solid #ddd;
padding-top:15px;
margin-top:20px;
display:flex;
justify-content:space-between;
align-items:center
}

.status{
padding:8px 16px;
border-radius:20px;
font-weight:bold;
font-size:14px;
background:#fff3cd;
color:#856404
}

.placed{
background:#fff3cd;
color:#856404
}

.confirmed{
background:#d4edda;
color:#155724
}

.shipped{
background:#cce5ff;
color:#004085
}

.delivered{
background:#d1ecf1;
color:#0c5460
}

.cancelled{
background:#f8d7da;
color:#721c24
}

.empty-orders{
background:white;
text-align:center;
padding:70px 20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.08)
}

.empty-orders h3{
color:#1f4d3a;
margin-bottom:10px
}

.empty-orders p{
color:#777
}

@media(max-width:700px){

header{
padding:15px;
gap:12px
}

.container{
width:94%
}

.order-header,
.order-footer{
flex-direction:column;
align-items:flex-start;
gap:12px
}

.product-area{
align-items:flex-start
}

.product-image{
width:80px;
height:80px
}

}
</style>
</head>

<body>

<header>

<h1>ReenaMart</h1>

<a href="products.html" class="shop-btn">
Continue Shopping
</a>

</header>

<div class="container">

<div class="page-title">

<h2>My Order History</h2>

<p>
View your orders and track their current status.
</p>

</div>

<div id="ordersContainer"></div>

<div id="emptyOrders"
class="empty-orders"
style="display:none;">

<h3>No Orders Yet</h3>

<p>
Your placed orders will appear here.
</p>

</div>

</div>

<script>

let orders=
JSON.parse(localStorage.getItem("orders")) || [];


/* -------------------------------
   PRICE FUNCTIONS
-------------------------------- */

function getSellingPrice(product){

return Number(
product.sellingPrice ??
product.price ??
0
);

}


function getDiscount(product){

const discount=
Number(product.discount ?? 0);

return Math.max(discount,0);

}


function getFinalPrice(product){

const storedFinal=
Number(product.finalPrice);

if(
Number.isFinite(storedFinal) &&
storedFinal>=0
){

return storedFinal;

}

const sellingPrice=
getSellingPrice(product);

const discount=
getDiscount(product);

return Math.max(
sellingPrice-
(sellingPrice*discount/100),
0
);

}


function getQuantity(product){

return Number(
product.quantity ??
product.qty ??
1
);

}


/* -------------------------------
   GET ORDER PRODUCTS
-------------------------------- */

function getOrderProducts(order){

if(
Array.isArray(order.products)
&& order.products.length>0
){

return order.products;

}

if(
Array.isArray(order.items)
&& order.items.length>0
){

return order.items;

}

if(order.product){

return [order.product];

}

return [];

}


/* -------------------------------
   DISPLAY ORDERS
-------------------------------- */

function displayOrders(){

const container=
document.getElementById(
"ordersContainer"
);

const emptyOrders=
document.getElementById(
"emptyOrders"
);

container.innerHTML="";


if(orders.length===0){

emptyOrders.style.display="block";

return;

}

emptyOrders.style.display="none";


orders
.slice()
.reverse()
.forEach(function(order){

const products=
getOrderProducts(order);

let productsHTML="";

let calculatedSubtotal=0;

let calculatedTotal=0;

let calculatedDiscount=0;


products.forEach(function(product){

const quantity=
getQuantity(product);

const sellingPrice=
getSellingPrice(product);

const discount=
getDiscount(product);

const finalPrice=
getFinalPrice(product);

const productTotal=
finalPrice*quantity;

const discountAmount=
Math.max(
(sellingPrice-finalPrice)*quantity,
0
);

calculatedSubtotal+=
sellingPrice*quantity;

calculatedTotal+=
productTotal;

calculatedDiscount+=
discountAmount;


const image=
product.image ||
product.imageUrl ||
"https://via.placeholder.com/100?text=Product";


let priceHTML="";

if(
discount>0 &&
sellingPrice>finalPrice
){

priceHTML=`

<p>

Price:

<span class="old-price">
₹${sellingPrice.toLocaleString("en-IN")}
</span>

<span class="product-final">
₹${finalPrice.toLocaleString("en-IN")}
</span>

</p>

<p class="discount">
${discount}% OFF
</p>

`;

}else{

priceHTML=`

<p>

Price:

<span class="product-final">
₹${finalPrice.toLocaleString("en-IN")}
</span>

</p>

`;

}


productsHTML+=`

<div class="product-area">

<img
src="${image}"
class="product-image"
alt="${product.name || "Product"}"
onerror="this.src='https://via.placeholder.com/100?text=Product'"
>

<div class="product-info">

<h3>
${product.name || "Product"}
</h3>

<p>
Category:
${product.category || "Product"}
</p>

<p>
Quantity:
${quantity}
</p>

${priceHTML}

<p>
Product Total:
<strong>
₹${productTotal.toLocaleString("en-IN")}
</strong>
</p>

</div>

</div>

`;

});


/* -------------------------------
   ORDER TOTALS
-------------------------------- */

const subtotal=
Number(
order.subtotal ??
calculatedSubtotal ??
0
);

const discount=
Number(
order.discount ??
calculatedDiscount ??
0
);

let total=
Number(
order.total ??
order.totalAmount ??
calculatedTotal ??
0
);


/*
Use calculated total when stored
total is missing or zero.
*/

if(
(!order.total &&
!order.totalAmount) &&
calculatedTotal>0
){

total=calculatedTotal;

}


/* -------------------------------
   ORDER INFORMATION
-------------------------------- */

const orderId=
order.orderId ||
order.id ||
"ReenaMart Order";


const orderDate=
order.orderDate ||
order.date ||
order.createdAt ||
"Recent Order";


const status=
order.status ||
"PLACED";


const statusClass=
String(status)
.toLowerCase()
.replace(/\s+/g,"-");


/* -------------------------------
   DELIVERY INFORMATION
-------------------------------- */

const customerName=
order.customerName ||
order.name ||
order.username ||
"Not available";


const mobile=
order.mobile ||
order.phone ||
order.mobileNumber ||
"Not available";


const address=
order.address ||
"Not available";


const city=
order.city ||
"Not available";


const state=
order.state ||
"Not available";


const pincode=
order.pincode ||
"Not available";


const payment=
order.paymentMethod ||
order.payment ||
"Not available";


/* -------------------------------
   ORDER CARD
-------------------------------- */

container.innerHTML+=`

<div class="order-card">

<div class="order-header">

<div class="order-id">

Order ID:
${orderId}

</div>

<div class="order-date">

${orderDate}

</div>

</div>


${productsHTML}


<div class="order-summary">

<div class="summary-row">

<span>
Subtotal:
</span>

<strong>
₹${subtotal.toLocaleString("en-IN")}
</strong>

</div>


<div class="summary-row summary-discount">

<span>
Discount:
</span>

<strong>
-₹${discount.toLocaleString("en-IN")}
</strong>

</div>


<div class="summary-row final-total">

<span>
Final Total:
</span>

<strong>
₹${total.toLocaleString("en-IN")}
</strong>

</div>

</div>


<div class="delivery-box">

<h3>
📦 Delivery Details
</h3>

<p>
<strong>Name:</strong>
${customerName}
</p>

<p>
<strong>Mobile:</strong>
${mobile}
</p>

<p>
<strong>Address:</strong>
${address}
</p>

<p>
<strong>City:</strong>
${city}
</p>

<p>
<strong>State:</strong>
${state}
</p>

<p>
<strong>Pincode:</strong>
${pincode}
</p>

<p class="payment">
Payment:
${payment}
</p>

</div>


<div class="order-footer">

<strong>
Order Status
</strong>

<span class="status ${statusClass}">
${status}
</span>

</div>

</div>

`;

});

}


/* -------------------------------
   START
-------------------------------- */

displayOrders();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | ReenaMart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="topbar">
        <a href="index.html" class="logo">ReenaMart</a>
        <nav id="nav" class="nav"></nav>
    </header>

    <main class="container">

        <section class="page-heading">
            <h1>My Shopping Cart</h1>
            <p>Review your products before checkout.</p>
        </section>

        <div class="grid-2">

            <section>
                <div id="cartRows">
                    <div class="box center">
                        Loading your cart...
                    </div>
                </div>
            </section>

            <aside>
                <div id="cartSummary"></div>
            </aside>

        </div>

        <p>
            <a href="products.html" class="btn gray">
                Continue Shopping
            </a>
        </p>

    </main>

    <footer class="container">
        <p class="muted">
            &copy; 2026 ReenaMart. All rights reserved.
        </p>
    </footer>

    <script src="../js/script.js"></script>
    <script src="../js/ai-bot.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderCart();
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reena Mart - Cart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #1f4d3a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
            color: #1f4d3a;
        }

        .cart-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 8px;
            color: #222;
        }

        .category {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
            font-size: 17px;
            color: #1f4d3a;
            margin-bottom: 8px;
        }

        .discount {
            color: #d35400;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .final-price {
            font-weight: bold;
            color: #198754;
            margin-bottom: 10px;
        }

        .stock {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 5px;
            background: #1f4d3a;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .quantity span {
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #bb2d3b;
        }

        .cart-summary {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 17px;
        }

        .discount-total {
            color: #d35400;
        }

        .final-total {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            margin-top: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #1f4d3a;
        }

        .checkout-btn {
            display: block;
            text-align: center;
            background: #f5a623;
            color: #111;
            text-decoration: none;
            padding: 14px;
            border-radius: 6px;
            margin-top: 20px;
            font-weight: bold;
        }

        .checkout-btn:hover {
            background: #e59400;
        }

        .empty-cart {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
        }

        .empty-cart h3 {
            color: #1f4d3a;
            margin-bottom: 10px;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 20px;
            background: #1f4d3a;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
        }

        .out-stock {
            color: #dc3545;
            font-weight: bold;
            margin-bottom: 10px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin-left: 8px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-item img {
                width: 100%;
                height: 180px;
            }

            .remove-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        🛍️ RM | Reena Mart
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="products.html">Like</a>
        <a href="cart.html">Cart</a>
    </nav>

</header>


<div class="container">

    <h1>🛒 My Cart</h1>

    <div id="cartContainer"></div>

</div>


<script>

let cart =
    JSON.parse(localStorage.getItem("cart")) || [];


/* ================================
   SELLING PRICE
================================ */

function getSellingPrice(item) {

    const price =
        Number(
            item.sellingPrice ??
            item.price ??
            0
        );

    return Math.max(price, 0);
}


/* ================================
   ADMIN DISCOUNT %
================================ */

function getDiscountPercentage(item) {

    const discount =
        Number(item.discount ?? 0);

    if (
        isNaN(discount) ||
        discount < 0
    ) {
        return 0;
    }

    return discount;
}


/* ================================
   FINAL PRICE
   Admin finalPrice = SOURCE OF TRUTH
================================ */

function getFinalPrice(item) {

    const sellingPrice =
        getSellingPrice(item);


    if (
        item.finalPrice !== undefined &&
        item.finalPrice !== null &&
        item.finalPrice !== ""
    ) {

        const storedFinalPrice =
            Number(item.finalPrice);

        if (!isNaN(storedFinalPrice)) {

            return Math.max(
                storedFinalPrice,
                0
            );
        }
    }


    /* Fallback */

    const discountPercentage =
        getDiscountPercentage(item);


    const discountAmount =
        sellingPrice *
        discountPercentage /
        100;


    return Math.max(
        sellingPrice - discountAmount,
        0
    );
}


/* ================================
   STOCK
================================ */

function getStock(item) {

    const stock =
        Number(
            item.stock ??
            item.quantity ??
            0
        );

    if (isNaN(stock) || stock < 0) {
        return 0;
    }

    return stock;
}


/* ================================
   QUANTITY
================================ */

function getQuantity(item) {

    const quantity =
        Number(
            item.quantity ??
            item.qty ??
            1
        );

    if (
        isNaN(quantity) ||
        quantity < 1
    ) {
        return 1;
    }

    return quantity;
}


/* ================================
   DISPLAY CART
================================ */

function displayCart() {

    const container =
        document.getElementById(
            "cartContainer"
        );


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty-cart">

                <h3>
                    Your Cart is Empty
                </h3>

                <p>
                    You haven't added any
                    products to your cart yet.
                </p>

                <a
                    href="products.html"
                    class="shop-btn"
                >
                    🛍️ Continue Shopping
                </a>

            </div>

        `;


        localStorage.removeItem(
            "cartTotal"
        );

        localStorage.removeItem(
            "cartSubtotal"
        );

        localStorage.removeItem(
            "cartDiscount"
        );

        return;
    }


    let subtotal = 0;

    let totalDiscount = 0;

    let finalTotal = 0;

    let html = "";


    cart.forEach(
        function(item, index) {

            let quantity =
                getQuantity(item);


            const stock =
                getStock(item);


            /*
               Prevent cart quantity
               from exceeding stock.
            */

            if (
                stock > 0 &&
                quantity > stock
            ) {

                quantity = stock;

                item.quantity =
                    stock;
            }


            const sellingPrice =
                getSellingPrice(item);


            const finalPrice =
                getFinalPrice(item);


            /*
               Discount amount is always:
               Selling Price - Final Price
            */

            const discountPerItem =
                Math.max(
                    sellingPrice -
                    finalPrice,
                    0
                );


            const itemSubtotal =
                sellingPrice *
                quantity;


            const itemDiscount =
                discountPerItem *
                quantity;


            const itemFinalTotal =
                finalPrice *
                quantity;


            subtotal +=
                itemSubtotal;


            totalDiscount +=
                itemDiscount;


            finalTotal +=
                itemFinalTotal;


            const outOfStock =
                stock <= 0;


            html += `

                <div class="cart-item">

                    <img
                        src="${
                            item.image ||
                            'https://via.placeholder.com/120'
                        }"
                        alt="${
                            item.name ||
                            'Product'
                        }"
                        onerror="
                            this.src=
                            'https://via.placeholder.com/120'
                        "
                    >


                    <div class="item-info">

                        <h3>
                            ${
                                item.name ||
                                "Product"
                            }
                        </h3>


                        <div class="category">
                            Category:
                            ${
                                item.category ||
                                "Product"
                            }
                        </div>


                        ${
                            item.selectedSize
                            ? `
                                <div class="category">
                                    Size:
                                    ${item.selectedSize}
                                </div>
                            `
                            : ""
                        }


                        <div class="price">
                            Selling Price:
                            ₹${
                                sellingPrice
                                .toLocaleString(
                                    "en-IN"
                                )
                            }
                        </div>


                        ${
                            discountPerItem > 0
                            ? `
                                <div class="discount">
                                    Discount:
                                    -₹${
                                        discountPerItem
                                        .toLocaleString(
                                            "en-IN"
                                        )
                                    }
                                </div>
                            `
                            : ""
                        }


                        <div class="final-price">
                            Final Price:
                            ₹${
                                finalPrice
                                .toLocaleString(
                                    "en-IN"
                                )
                            }
                        </div>


                        ${
                            outOfStock
                            ? `
                                <div class="out-stock">
                                    ❌ Out of Stock
                                </div>
                            `
                            : `
                                <div class="stock">
                                    Stock Available:
                                    ${stock}
                                </div>
                            `
                        }


                        <div class="quantity">

                            <button
                                onclick="
                                    decreaseQuantity(
                                        ${index}
                                    )
                                "
                                ${
                                    quantity <= 1
                                    ? ""
                                    : ""
                                }
                            >
                                −
                            </button>


                            <span>
                                ${quantity}
                            </span>


                            <button
                                onclick="
                                    increaseQuantity(
                                        ${index}
                                    )
                                "
                                ${
                                    stock > 0 &&
                                    quantity >= stock
                                    ? "disabled"
                                    : ""
                                }
                            >
                                +
                            </button>

                        </div>


                        <div
                            style="
                                margin-top:10px;
                                font-weight:bold;
                            "
                        >
                            Product Total:
                            ₹${
                                itemFinalTotal
                                .toLocaleString(
                                    "en-IN"
                                )
                            }
                        </div>

                    </div>


                    <button
                        class="remove-btn"
                        onclick="
                            removeItem(
                                ${index}
                            )
                        "
                    >
                        Remove
                    </button>

                </div>

            `;
        }
    );


    /*
       Save corrected quantities
    */

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    html += `

        <div class="cart-summary">

            <div class="summary-row">

                <span>
                    Subtotal:
                </span>

                <strong>
                    ₹${
                        subtotal
                        .toLocaleString(
                            "en-IN"
                        )
                    }
                </strong>

            </div>


            <div
                class="summary-row discount-total"
            >

                <span>
                    Total Discount:
                </span>

                <strong>
                    -₹${
                        totalDiscount
                        .toLocaleString(
                            "en-IN"
                        )
                    }
                </strong>

            </div>


            <div
                class="summary-row final-total"
            >

                <span>
                    Final Total:
                </span>

                <strong>
                    ₹${
                        finalTotal
                        .toLocaleString(
                            "en-IN"
                        )
                    }
                </strong>

            </div>


            <a
                href="checkout.html"
                class="checkout-btn"
            >
                Proceed to Checkout →
            </a>

        </div>

    `;


    container.innerHTML =
        html;


    /*
       Save exact totals
       for checkout compatibility.
    */

    localStorage.setItem(
        "cartSubtotal",
        subtotal
    );

    localStorage.setItem(
        "cartDiscount",
        totalDiscount
    );

    localStorage.setItem(
        "cartTotal",
        finalTotal
    );
}


/* ================================
   INCREASE QUANTITY
================================ */

function increaseQuantity(index) {

    const item =
        cart[index];


    if (!item) {
        return;
    }


    const currentQuantity =
        getQuantity(item);


    const stock =
        getStock(item);


    if (
        stock <= 0
    ) {

        alert(
            "This product is out of stock."
        );

        return;
    }


    if (
        currentQuantity >= stock
    ) {

        alert(
            "You cannot add more than available stock."
        );

        return;
    }


    item.quantity =
        currentQuantity + 1;


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    displayCart();
}


/* ================================
   DECREASE QUANTITY
================================ */

function decreaseQuantity(index) {

    const item =
        cart[index];


    if (!item) {
        return;
    }


    const quantity =
        getQuantity(item);


    if (quantity > 1) {

        item.quantity =
            quantity - 1;

    } else {

        cart.splice(
            index,
            1
        );
    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    displayCart();
}


/* ================================
   REMOVE ITEM
================================ */

function removeItem(index) {

    if (
        index < 0 ||
        index >= cart.length
    ) {
        return;
    }


    cart.splice(
        index,
        1
    );


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    displayCart();
}


/* ================================
   START
================================ */

displayCart();

</script>

</body>
</html>

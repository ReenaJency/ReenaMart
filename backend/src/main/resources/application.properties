spring.application.name=reenamart-backend

# MySQL connection
# Set DB_PASSWORD in the terminal before starting Spring Boot.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reenamart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
